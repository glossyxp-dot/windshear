// This file tells TrenchBroom what a WindShear map is. It is the same
// format TrenchBroom writes for Quake, so the converter can read it.
//
// The textures are not here and they are not the job of TrenchBroom. The
// name of the material on a face says what shape the piece is and which of
// the four materials it wears; the picture on it is made in Godot.
//
// Copy this folder into the TrenchBroom games folder to install it:
//   ~/.config/TrenchBroom/games/WindShear/
{
    version: 9,
    name: "WindShear",
    fileformats: [
        { "format": "Valve", "initialmap": "initial_valve.map" }
    ],
    filesystem: {
        "searchpath": ".",
        "packageformat": { "extension": ".pak", "format": "idpak" }
    },
    materials: {
        "root": "textures",
        "format": { "extensions": [".png"], "format": "image" }
    },
    entities: {
        "definitions": [ "WindShear.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0"
    },
    tags: {
        "brush": [],
        "brushface": []
    },
    "faceattribs": {
        "surfaceflags": [],
        "contentflags": []
    },
    "softMapBounds": "-4096 -4096 -4096 4096 4096 4096"
}
